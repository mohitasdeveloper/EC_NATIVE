<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECampus - Offline</title>
<style>
  body { margin:0; height:100vh; display:flex; justify-content:center; align-items:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f8f9fa; }
  .card { text-align:center; padding:30px; max-width:320px; }
  h1 { font-size:24px; margin-bottom:8px; color:#191c1d; }
  p { color:#666; margin-bottom:25px; font-size:14px; }
  button { padding:14px 32px; border:none; background:#006e1c; color:#fff; border-radius:30px;
           font-size:16px; font-weight:600; cursor:pointer; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
<div class="card">
  <h1>No Connection</h1>
  <p>ECampus couldn't load. Please check your internet connection and try again.</p>
  <button onclick="location.replace('index.html')">Retry</button>
</div>
<script>
  // If connectivity comes back on its own, jump straight back in.
  window.addEventListener('online', () => location.replace('index.html'));
</script>
</body>
</html>
