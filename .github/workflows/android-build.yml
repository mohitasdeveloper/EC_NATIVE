          # a safe, always-present resource to point at.
          cat << 'EOF' > android/app/src/main/res/xml/exam_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="200dp"
              android:minHeight="120dp"
              android:minResizeWidth="200dp"
              android:minResizeHeight="120dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/exam_widget"
              android:previewImage="@mipmap/ic_launcher"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/exam_widget_description" />
          EOF

          cat << 'EOF' > android/app/src/main/res/values/exam_widget_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="exam_widget_brand">ECampus · BAFS</string>
              <string name="exam_widget_description">Live countdown to your next BAFS exam</string>
              <string name="exam_widget_days_label">Days</string>
              <string name="exam_widget_hours_label">Hours</string>
              <string name="exam_widget_mins_label">Mins</string>
              <string name="exam_widget_secs_label">Secs</string>
          </resources>
          EOF

      - name: Create Network Security Config File
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="true">ecampus-android.mohitmali.in</domain>
              </domain-config>
          </network-security-config>
          EOF

      - name: Inject Firebase google-services.json Configuration
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Validate google-services.json
        run: |
          FILE="android/app/google-services.json"
          if ! jq -e '.project_info' "$FILE" > /dev/null 2>&1; then
            echo "::error::google-services.json is missing 'project_info' — the GOOGLE_SERVICES_JSON secret is empty, truncated, or contains the wrong content. Re-check it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Sync Capacitor Changes & Inject Google Services Plugin
        run: |
          npx cap sync android
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Add WorkManager dependency for Exam Widget
        # ExamWidgetUpdateWorker (added in "Add BAFS Exam Countdown Widget"
        # above) extends androidx.work.Worker — this is the one library
        # dependency it needs that the default Capacitor template doesn't
        # already pull in. WorkManager ships its own consumer ProGuard
        # rules bundled in the AAR, so no extra keep rules are needed for
        # the library itself — only for our two classes (see the R8 step
        # below).
        run: |
          sed -i '/dependencies {/a \    implementation "androidx.work:work-runtime:2.9.1"' android/app/build.gradle
          grep -q "androidx.work:work-runtime" android/app/build.gradle || { echo "::error::Could not insert the WorkManager dependency — android/app/build.gradle's dependencies block may have changed shape."; exit 1; }

      - name: Debug secret lengths (temporary — remove after)
        run: |
          echo "KEYSTORE_BASE64 length: $(printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | wc -c)  (expected 3652)"
          echo "KEYSTORE_PASSWORD length: $(printf '%s' "${{ secrets.KEYSTORE_PASSWORD }}" | wc -c)  (expected 25)"
          echo "KEY_ALIAS length: $(printf '%s' "${{ secrets.KEY_ALIAS }}" | wc -c)  (expected 11)"
          echo "KEY_PASSWORD length: $(printf '%s' "${{ secrets.KEY_PASSWORD }}" | wc -c)  (expected 25)"
      
      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Validate keystore credentials
        run: |
          keytool -list -keystore android/app/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" > /dev/null \
            || { echo "::error::Keystore/alias/password mismatch — check KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_ALIAS secrets."; exit 1; }

      - name: Setup Gradle Sign Environment Variables
        run: |
          echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Inject Signing Configuration & Automate Version Code
        run: |
          GRADLE_PATH="android/app/build.gradle"
          APP_VARS_PATH="android/variables.gradle"
          
          if [ -f "$APP_VARS_PATH" ]; then
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/g" $APP_VARS_PATH
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/g" $APP_VARS_PATH
          fi
          sed -i "s/targetSdkVersion .*/targetSdkVersion 36/g" $GRADLE_PATH
          sed -i "s/compileSdkVersion .*/compileSdkVersion 36/g" $GRADLE_PATH
          
          # versionCode must be higher than anything already on Play (2.0.3 = 87, 2.1 upload = 12).
          # github.run_number restarted low, so add an offset: run 1 -> 101, run 12 -> 112, etc.
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          echo "Using versionCode $VERSION_CODE"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" $GRADLE_PATH
          sed -i "s/versionName \"1.0\"/versionName \"2.1\"/g" $GRADLE_PATH
          
          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file(RELEASE_STORE_FILE)\n            storePassword RELEASE_STORE_PASSWORD\n            keyAlias RELEASE_KEY_ALIAS\n            keyPassword RELEASE_KEY_PASSWORD\n        }\n    }' $GRADLE_PATH
          sed -i '/minifyEnabled/i \            signingConfig signingConfigs.release' $GRADLE_PATH

      - name: Enable R8 (minify + shrink) and write keep rules
        run: |
          GRADLE_PATH="android/app/build.gradle"

          # Play Console "DEX code optimization" (Obfuscation 2%): the Capacitor
          # template ships with minifyEnabled false, so nothing was ever
          # shrunk/renamed. Turn on R8 for release + resource shrinking.
          sed -i 's/minifyEnabled false/minifyEnabled true/' $GRADLE_PATH
          sed -i '/minifyEnabled true/a \            shrinkResources true' $GRADLE_PATH
          sed -i 's/proguard-android.txt/proguard-android-optimize.txt/' $GRADLE_PATH
          grep -n "minifyEnabled\|shrinkResources\|proguardFiles" $GRADLE_PATH
          grep -q "minifyEnabled true" $GRADLE_PATH || { echo "::error::Could not enable minifyEnabled — the Capacitor template's build.gradle changed; update this step."; exit 1; }

          cat << 'EOF' > android/app/proguard-rules.pro
          # ---- Readable crash traces in Play Console (mapping.txt is bundled in the .aab)
          -keepattributes SourceFile,LineNumberTable,*Annotation*,Signature,InnerClasses,EnclosingMethod
          -renamesourcefileattribute SourceFile

          # ---- JavaScript bridges injected in MainActivity (AndroidDownloader,
          # ---- AndroidLinkHandler, screenshot-block bridge). R8 must not strip or
          # ---- rename @JavascriptInterface methods or the web layer calls nothing.
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }

          # ---- Capacitor core + every plugin (loaded by class name via reflection)
          -keep class com.getcapacitor.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keepclassmembers class * {
              @com.getcapacitor.PluginMethod <methods>;
              @com.getcapacitor.annotation.PermissionCallback <methods>;
              @com.getcapacitor.annotation.ActivityCallback <methods>;
          }
          -dontwarn com.getcapacitor.**

          # ---- @capgo/inappbrowser
          -keep class ee.forgr.capacitor_inappbrowser.** { *; }
          -dontwarn ee.forgr.capacitor_inappbrowser.**

          # ---- MainActivity is referenced from the manifest
          -keep class com.mohit.ecampus.MainActivity { *; }

          # ---- Exam widget: ExamWidgetProvider is referenced from the manifest
          # (by class name, like MainActivity), and both Worker classes are
          # instantiated by WorkManager via reflection using their class name —
          # R8 renaming/stripping any of them breaks the widget silently (no
          # crash, it just never updates).
          -keep class com.mohit.ecampus.ExamWidgetProvider { *; }
          -keep class com.mohit.ecampus.ExamWidgetUpdateWorker { *; }
          -keep class com.mohit.ecampus.ExamWidgetRedrawWorker { *; }
          EOF

          # shrinkResources removes drawables/mipmaps that are only looked up by
          # NAME at runtime (splash screen "splash", notification icons, launcher
          # icons) — keep them so the splash / push icons don't go missing.
          # @layout/* is here for the same reason: exam_widget.xml is referenced
          # from exam_widget_info.xml's android:initialLayout attribute (a
          # resource-XML reference, not a code reference the shrinker can trace
          # as reliably as an R.layout.* usage in Java).
          mkdir -p android/app/src/main/res/raw
          cat << 'EOF' > android/app/src/main/res/raw/keep.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:shrinkMode="lenient"
              tools:keep="@drawable/*,@mipmap/*,@raw/*,@color/*,@xml/*,@layout/*" />
          EOF

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug & Signed Release Packages
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload R8 mapping (keep for de-obfuscating crashes)
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-R8-Mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
