          package com.mohit.ecampus;

          import android.content.Context;
          import androidx.annotation.NonNull;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;

          // A pure redraw, no network — scheduled by ExamWidgetProvider's
          // scheduleNextTick(), roughly once a minute, to keep the Days/
          // Hours/Mins/Secs tiles reasonably fresh between the ordinary
          // 30-min ExamWidgetUpdateWorker refreshes. Every firing calls
          // updateAppWidget(), which recomputes all four numbers straight
          // from wall-clock time and reschedules the next tick itself — so
          // even a late-firing tick (e.g. deferred by battery optimization)
          // self-corrects to the right numbers the moment it does run.
          public class ExamWidgetRedrawWorker extends Worker {
              public ExamWidgetRedrawWorker(@NonNull Context context, @NonNull WorkerParameters params) {
                  super(context, params);
              }

              @NonNull
              @Override
              public Result doWork() {
                  ExamWidgetProvider.updateAllWidgets(getApplicationContext());
                  return Result.success();
              }
          }
          EOF

